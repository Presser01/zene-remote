plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.peresztegi.zeneremote'
    compileSdk 35

    defaultConfig {
        applicationId 'hu.peresztegi.zeneremote'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Nincs külső függőség: csak a sima Android SDK.
